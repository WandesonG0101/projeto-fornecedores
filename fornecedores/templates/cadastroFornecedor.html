<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Novo Fornecedor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{% url 'listar_fornecedores' %}">Fornecedores</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'listar_fornecedores' %}">Fornecedores</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="{% url 'cadastro_fornecedor' %}">Novo Fornecedor</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'logout' %}">Sair</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <h1 class="h3 mb-4">Cadastrar Fornecedor</h1>

        <form method="post" class="row g-3">
            {% csrf_token %}
            <div class="col-12 col-md-6">
                <label for="nome_empresa" class="form-label">Nome da empresa</label>
                <input type="text" class="form-control" id="nome_empresa" name="nome_empresa" maxlength="150" required>
            </div>
            <div class="col-12 col-md-6">
                <label for="cnpj" class="form-label">CNPJ</label>
                <input type="text" class="form-control" id="cnpj" name="cnpj" maxlength="18" required>
            </div>
            <div class="col-12 col-md-6">
                <label for="telefone" class="form-label">Telefone</label>
                <input type="text" class="form-control" id="telefone" name="telefone" maxlength="20" required>
            </div>
            <div class="col-12 col-md-6">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <div class="col-12">
                <label for="endereco" class="form-label">Endereco</label>
                <input type="text" class="form-control" id="endereco" name="endereco" maxlength="200" required>
            </div>
            <div class="col-12 col-md-5">
                <label for="cidade" class="form-label">Cidade</label>
                <input type="text" class="form-control" id="cidade" name="cidade" maxlength="100" required>
            </div>
            <div class="col-12 col-md-2">
                <label for="estado" class="form-label">Estado</label>
                <input type="text" class="form-control text-uppercase" id="estado" name="estado" maxlength="2" required>
            </div>
            <div class="col-12 col-md-5">
                <label for="categoria" class="form-label">Categoria</label>
                <input type="text" class="form-control" id="categoria" name="categoria" maxlength="100" required>
            </div>
            <div class="col-12">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="ativo" name="ativo" checked>
                    <label class="form-check-label" for="ativo">Fornecedor ativo</label>
                </div>
            </div>
            <div class="col-12 d-flex gap-2">
                <button type="submit" class="btn btn-primary">Salvar</button>
                <a href="{% url 'listar_fornecedores' %}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
